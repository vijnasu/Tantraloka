<!doctype html>
<html lang="{{ site.lang | default: 'kn' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#18372f">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">ವಿಷಯಕ್ಕೆ ಹೋಗಿ</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="ತಂತ್ರಾಲೋಕ ಮುಖ್ಯ ಪುಟ">
          <span class="brand-mark" aria-hidden="true">ತ</span>
          <span class="brand-name">ತಂತ್ರಾಲೋಕ</span>
        </a>
        <nav class="site-nav" aria-label="ಮುಖ್ಯ ಸಂಚಾರ">
          <a href="{{ '/' | relative_url }}">ಪಠ್ಯಸೂಚಿ</a>
        </nav>
      </div>
    </header>
    <main id="main" class="page-shell{% if page.url == '/' %} home-shell{% endif %}">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="footer-inner">
        <span>ತಂತ್ರಾಲೋಕ</span>
        <span>ಮೂಲಪಾಠ · ಕನ್ನಡ ವಿವರಣೆ</span>
      </div>
    </footer>
    <script>
      const pageLinks = new Map([
        {% for document in site.pages %}
          {% if document.name contains '.md' %}
            ['{{ document.name | downcase }}', '{{ document.url | relative_url }}'],
          {% endif %}
        {% endfor %}
      ]);

      for (const link of document.querySelectorAll('.page-shell a[href$=".md"]')) {
        const fileName = link.getAttribute('href').split(/[?#]/, 1)[0].split('/').pop().toLowerCase();
        link.href = pageLinks.get(fileName) || '{{ '/' | relative_url }}#library-title';
      }
    </script>
  </body>
</html>
